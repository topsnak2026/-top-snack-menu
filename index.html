
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOP SNACK">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>TOP SNACK</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
header{background:#111;text-align:center;padding:22px;border-bottom:4px solid #f5c400}
.logo{font-size:34px;font-weight:900;color:#f5c400}
header p{color:#ccc;margin:8px 0}
.container{max-width:900px;margin:auto;padding:15px}
.notice{background:#222;color:#f5c400;text-align:center;padding:14px;border-radius:12px;margin:15px 0}
h2{color:#f5c400}
.search{width:100%;padding:14px;border-radius:12px;background:#222;border:1px solid #444;color:white;font-size:16px;margin:10px 0}
.categories{display:flex;gap:8px;overflow-x:auto;padding:10px 0 15px}
.catbtn{white-space:nowrap;background:#222;color:#f5c400;border:1px solid #f5c400;padding:12px 15px;border-radius:10px;font-weight:bold;cursor:pointer}
.catbtn.active{background:#f5c400;color:#111}
.product{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#202020;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:10px}
.product-info{flex:1}
.product-name{font-weight:bold}
.product-price{color:#f5c400;margin-top:5px}
.controls{display:flex;align-items:center;gap:8px}
.controls button{width:38px;height:38px;background:#f5c400;color:#111;border:0;border-radius:9px;font-size:23px;font-weight:bold}
.qty{min-width:22px;text-align:center}
.cart-button{position:fixed;bottom:12px;left:12px;right:12px;max-width:900px;margin:auto;background:#f5c400;color:#111;padding:16px;border:0;border-radius:14px;font-weight:bold;font-size:18px;z-index:50}
footer{text-align:center;color:#aaa;padding:30px 15px 110px;line-height:1.8}
footer strong{color:#f5c400}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:100;overflow-y:auto;padding:15px}
.modal-content{background:#1b1b1b;border:2px solid #f5c400;border-radius:18px;max-width:600px;margin:20px auto;padding:20px}
input,textarea,select{width:100%;padding:13px;border-radius:10px;margin:8px 0;border:1px solid #444;background:#292929;color:white;font-size:16px}
.action{width:100%;padding:15px;border:0;border-radius:12px;margin-top:10px;font-size:16px;font-weight:bold}
.whatsapp{background:#25D366;color:white}
.close{background:#333;color:white}
.clear{background:#b52b2b;color:white}
.total{font-size:22px;font-weight:bold;color:#f5c400;text-align:right;margin:20px 0}
.cartitem{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #333}
.hidden{display:none!important}
.adminbtn{background:#333;color:#aaa;border:1px solid #555;padding:10px;border-radius:9px;margin-top:10px}
.status{color:#f5c400;text-align:center;padding:12px}
@media(min-width:700px){.container{padding:25px}}
</style>
</head>
<body>

<header>
<div class="logo">🍔 TOP SNACK</div>
<p>Rue Godfroid Kurth 109 — 1140 Evere</p>
</header>

<div class="container">

<div class="notice" id="notice">
Bienvenue chez TOP SNACK ! Choisissez vos plats.
</div>

<div style="display:flex;gap:8px">
<select id="language" onchange="changeLanguage()" style="width:auto">
<option value="fr">🇫🇷 Français</option>
<option value="nl">🇳🇱 Nederlands</option>
<option value="en">🇬🇧 English</option>
</select>
</div>

<input class="search" id="search" placeholder="🔎 Rechercher un plat..." oninput="renderProducts()">

<div class="categories" id="categories"></div>

<div id="products"></div>

<div id="closedMessage" class="status hidden"></div>

<button class="adminbtn" onclick="adminLogin()">⚙️ Administration</button>

</div>

<footer>
<strong>TOP SNACK</strong><br>
Rue Godfroid Kurth 109 — 1140 Evere<br>
📞 +32 496 96 96 28
</footer>

<button class="cart-button" onclick="openCart()">
🛒 <span id="cartLabel">Mon panier</span> — <span id="cartCount">0</span> — <span id="cartTotal">0.00</span> €
</button>

<div class="modal" id="cartModal">
<div class="modal-content">
<h2 id="cartTitle">🛒 Mon panier</h2>
<div id="cartItems"></div>
<div class="total">Total : <span id="modalTotal">0.00</span> €</div>

<hr style="border-color:#333">

<h2 id="infoTitle">Informations de commande</h2>
<input id="customerName" placeholder="Votre nom">
<input id="customerPhone" placeholder="Votre téléphone" type="tel">

<select id="orderType" onchange="toggleAddress()">
<option value="À emporter">À emporter</option>
<option value="Livraison">Livraison</option>
</select>

<div id="addressBox" class="hidden">
<input id="customerAddress" placeholder="Adresse de livraison">
</div>

<label id="sauceLabel">Sauces (facultatif)</label>
<select id="sauce">
<option value="Aucune">Aucune</option>
<option value="Andalouse">Andalouse</option>
<option value="Samouraï">Samouraï</option>
<option value="Algérienne">Algérienne</option>
<option value="Aïoli">Aïoli</option>
<option value="Ketchup">Ketchup</option>
<option value="Mayonnaise">Mayonnaise</option>
<option value="Brasil">Brasil</option>
<option value="Cocktail">Cocktail</option>
<option value="Barbecue">Barbecue</option>
<option value="Poivre">Poivre</option>
<option value="Pitta">Pitta</option>
<option value="Tartare">Tartare</option>
</select>

<textarea id="customerNote" placeholder="Suppléments ou instructions..." rows="3"></textarea>

<button class="action whatsapp" onclick="sendWhatsApp()">📲 ENVOYER SUR WHATSAPP</button>
<button class="action clear" onclick="clearCart()">🗑 Vider le panier</button>
<button class="action close" onclick="closeCart()">✖ Fermer</button>
</div>
</div>

<div class="modal" id="adminModal">
<div class="modal-content">
<h2>⚙️ Administration</h2>
<p id="adminStatus"></p>

<button class="action" id="toggleOrders" onclick="toggleOrders()"></button>

<button class="action close" onclick="closeAdmin()">Fermer</button>
</div>
</div>

<script>
const menu=[
{category:"MITRAILLETTE / DURUM / PAIN TURC",products:[
["PITTA",7.50],["POULET",7.50],["KOFTE",7.50],["FALAFEL",7.50],
["MIXTE",8],["BOEUF",8],["HAMBURGER",7],["FRICADELLE",7],
["BOULETTE",7],["MEXICANO",7],["POULYCROQ",7.50],["CHIX FINGERS",7.50],
["MERGUEZ",7.50],["ADANA",7.50],["BROCH.CABILLAUD",7.50],
["BROCH.DINDE",7.50],["BROCH.BOEUF",8],["BROCH.POULET",8]
]},
{category:"SNACKS",products:[
["Hamburger",3],["Fricadelle",3],["Croquette Fromage",3],
["Boulette",3.50],["Mexicano",3.50],["Poulycroq",3.50],
["Chix Fingers",3.50],["Mini Loempia",3.50],["Broch.Cabillaud",3.50],
["Broch.Dinde",3.50],["Broch.Boeuf",4],["Tenders",4],
["Nuggets",4],["Wings",4],["Broch.Pilons Poulet",4.50],
["Broch.Poulet",4.50]
]},
{category:"ASSIETTES",products:[
["Pitta",15],["Poulet",15],["Falafel",15],["Broch.Dinde",15],
["Broch.Cabillaud",15],["Pilons Poulet",15],["Calamar",15],
["Kofte",16],["Adana",16],["Boeuf",17],["Mixte",17],
["Broch.Boeuf",17],["Broch.Poulet",17],["Top Grill",22],
["Côte d'Agneau",22]
]},
{category:"BOX",products:[["BOX Kids",10],["BOX Doner",8]]},
{category:"FRITES",products:[["Petite Frites",3.50],["Grande Frites",4.50],["Frites Mini",1.50]]},
{category:"BURGERS",products:[["Burger",6.50],["Cheeseburger",7],["Double Burger",8],["Double Cheeseburger",8]]},
{category:"BICKY",products:[["Bicky",5],["Bicky Cheese",6],["Bicky Chicken",5.50],["Bicky Fish",5.50]]},
{category:"GYROS",products:[["Gyros",7],["Gyros Special",8],["Gyros Box",7]]},
{category:"KAPSALON",products:[["Kapsalon",10],["Kapsalon XL",11]]},
{category:"MENUS",products:[["Menu Hamburger",10],["Menu Fricadelle",9],["Menu Chicken",11],["Menu Mixte",13],["Menu Top Grill",17]]},
{category:"TACOS",products:[["Tacos 1 Viande",8],["Tacos 2 Viandes",9],["Tacos 3 Viandes",13]]},
{category:"DESSERTS",products:[["Dessert",4]]},
{category:"SAUCES",products:[["Sauce",1]]},
{category:"SUPPLÉMENTS",products:[["Supplément",1]]}
];

const translations={
fr:{
welcome:"Bienvenue chez TOP SNACK ! Choisissez vos plats.",
cart:"Mon panier",search:"🔎 Rechercher un plat...",
closed:"Les commandes en ligne sont actuellement fermées.",
open:"Les commandes en ligne sont ouvertes.",
send:"📲 ENVOYER SUR WHATSAPP",
pickup:"À emporter",delivery:"Livraison",
empty:"Votre panier est vide.",admin:"Administration"
},
nl:{
welcome:"Welkom bij TOP SNACK! Kies uw gerechten.",
cart:"Mijn winkelmand",search:"🔎 Zoek een gerecht...",
closed:"Online bestellen is momenteel gesloten.",
open:"Online bestellen is geopend.",
send:"📲 BESTELLEN VIA WHATSAPP",
pickup:"Afhalen",delivery:"Levering",
empty:"Uw winkelmand is leeg.",admin:"Beheer"
},
en:{
welcome:"Welcome to TOP SNACK! Choose your food.",
cart:"My cart",search:"🔎 Search food...",
closed:"Online orders are currently closed.",
open:"Online orders are open.",
send:"📲 SEND ORDER ON WHATSAPP",
pickup:"Pickup",delivery:"Delivery",
empty:"Your cart is empty.",admin:"Administration"
}
};

let cart={};
let selectedCategory=0;
let lang="fr";
let orderingEnabled=localStorage.getItem("topSnackOpen")!=="false";

function price(n){return Number(n).toFixed(2)}
function t(key){return translations[lang][key]||key}

function changeLanguage(){
lang=document.getElementById("language").value;
document.getElementById("notice").textContent=t("welcome");
document.getElementById("cartLabel").textContent=t("cart");
document.getElementById("search").placeholder=t("search");
document.querySelector(".whatsapp").textContent=t("send");
renderCategories();
renderProducts();
}

function renderCategories(){
const box=document.getElementById("categories");
box.innerHTML="";
menu.forEach((c,i)=>{
const b=document.createElement("button");
b.className="catbtn"+(selectedCategory===i?" active":"");
b.textContent=c.category;
b.onclick=()=>{selectedCategory=i;renderCategories();renderProducts()};
box.appendChild(b);
});
}

function renderProducts(){
const box=document.getElementById("products");
box.innerHTML="";
const query=document.getElementById("search").value.trim().toLowerCase();

menu.forEach((category,ci)=>{
if(ci!==selectedCategory)return;

category.products.forEach((p,pi)=>{
if(query&&!p[0].toLowerCase().includes(query))return;

const key=ci+"_"+pi;
const qty=cart[key]?.qty||0;

const row=document.createElement("div");
row.className="product";

const info=document.createElement("div");
info.className="product-info";

const name=document.createElement("div");
name.className="product-name";
name.textContent=p[0];

const priceDiv=document.createElement("div");
priceDiv.className="product-price";
priceDiv.textContent=price(p[1])+" €";

info.append(name,priceDiv);

const controls=document.createElement("div");
controls.className="controls";

const minus=document.createElement("button");
minus.textContent="−";
minus.onclick=()=>changeQty(key,-1,p);

const q=document.createElement("span");
q.className="qty";
q.textContent=qty;

const plus=document.createElement("button");
plus.textContent="+";
plus.onclick=()=>changeQty(key,1,p);

controls.append(minus,q,plus);
row.append(info,controls);
box.appendChild(row);
});
});

if(query){
menu.forEach((category,ci)=>{
if(ci===selectedCategory)return;
category.products.forEach((p,pi)=>{
if(!p[0].toLowerCase().includes(query))return;
const key=ci+"_"+pi;
const qty=cart[key]?.qty||0;
const row=document.createElement("div");
row.className="product";
const info=document.createElement("div");
info.className="product-info";
info.innerHTML="<div class='product-name'></div><div class='product-price'></div>";
info.querySelector(".product-name").textContent=p[0]+" ("+category.category+")";
info.querySelector(".product-price").textContent=price(p[1])+" €";
const controls=document.createElement("div");
controls.className="controls";
const m=document.createElement("button");m.textContent="−";m.onclick=()=>changeQty(key,-1,p);
const q=document.createElement("span");q.className="qty";q.textContent=qty;
const a=document.createElement("button");a.textContent="+";a.onclick=()=>changeQty(key,1,p);
controls.append(m,q,a);row.append(info,controls);box.appendChild(row);
});
});
}
}

function changeQty(key,delta,p){
if(!orderingEnabled){alert(t("closed"));return}
if(!cart[key])cart[key]={name:p[0],price:p[1],qty:0};
cart[key].qty+=delta;
if(cart[key].qty<=0)delete cart[key];
renderProducts();
updateCart();
}

function updateCart(){
let count=0,total=0;
Object.values(cart).forEach(i=>{count+=i.qty;total+=i.qty*i.price});
document.getElementById("cartCount").textContent=count;
document.getElementById("cartTotal").textContent=price(total);
document.getElementById("modalTotal").textContent=price(total);
}

function openCart(){
renderCart();
document.getElementById("cartModal").style.display="block";
}
function closeCart(){document.getElementById("cartModal").style.display="none"}

function renderCart(){
const box=document.getElementById("cartItems");
box.innerHTML="";
const items=Object.values(cart);
if(!items.length){box.textContent=t("empty");return}
items.forEach(i=>{
const row=document.createElement("div");
row.className="cartitem";
const n=document.createElement("span");
n.textContent=i.qty+" × "+i.name;
const p=document.createElement("span");
p.textContent=price(i.qty*i.price)+" €";
row.append(n,p);
box.appendChild(row);
});
}

function toggleAddress(){
document.getElementById("addressBox").classList.toggle("hidden",document.getElementById("orderType").value!=="Livraison");
}

function sendWhatsApp(){
const items=Object.values(cart);
if(!items.length){alert(t("empty"));return}
if(!orderingEnabled){alert(t("closed"));return}

const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const type=document.getElementById("orderType").value;
const address=document.getElementById("customerAddress").value.trim();
const sauce=document.getElementById("sauce").value;
const note=document.getElementById("customerNote").value.trim();

if(!name||!phone){alert("Veuillez entrer votre nom et votre téléphone.");return}
if(type==="Livraison"&&!address){alert("Veuillez entrer votre adresse.");return}

let total=0;
let msg="🍔 *TOP SNACK - COMMANDE*%0A%0A";
msg+="👤 "+encodeURIComponent(name)+"%0A";
msg+="📞 "+encodeURIComponent(phone)+"%0A";
msg+="📦 "+encodeURIComponent(type)+"%0A";
if(type==="Livraison")msg+="📍 "+encodeURIComponent(address)+"%0A";
msg+="%0A*Commande :*%0A";

items.forEach(i=>{
const s=i.qty*i.price;
total+=s;
msg+="• "+encodeURIComponent(i.name)+" × "+i.qty+" = "+price(s)+" €%0A";
});

msg+="%0A🥫 Sauce : "+encodeURIComponent(sauce);
if(note)msg+="%0A📝 "+encodeURIComponent(note);
msg+="%0A%0A💰 *TOTAL : "+price(total)+" €*";

window.location.href="https://wa.me/32496969628?text="+msg;
}

function clearCart(){
if(!confirm("Vider le panier ?"))return;
cart={};
renderProducts();
updateCart();
renderCart();
}

function adminLogin(){
const pass=prompt("Mot de passe administrateur :");
if(pass==="6731"){
updateAdmin();
document.getElementById("adminModal").style.display="block";
}else if(pass!==null){alert("Mot de passe incorrect");}
}

function updateAdmin(){
const button=document.getElementById("toggleOrders");
button.textContent=orderingEnabled?"🔴 Fermer les commandes":"🟢 Ouvrir les commandes";
document.getElementById("adminStatus").textContent=orderingEnabled?"Commandes ouvertes":"Commandes fermées";
}

function toggleOrders(){
orderingEnabled=!orderingEnabled;
localStorage.setItem("topSnackOpen",orderingEnabled);
updateAdmin();
document.getElementById("closedMessage").textContent=orderingEnabled?t("open"):t("closed");
document.getElementById("closedMessage").classList.remove("hidden");
renderProducts();
}

function closeAdmin(){document.getElementById("adminModal").style.display="none"}

document.getElementById("notice").textContent=t("welcome");
renderCategories();
renderProducts();
updateCart();
</script>
</body>
</html>
