<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;

  padding: 25px 15px;
}

header h1 {
  margin: 0;
  font-size: 32px;
  font-weight: 900;
}

header p {
  margin: 8px 0 0;

}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

/* =========================
   GALERIE PHOTOS
========================= */

.gallery-title {
  text-align: center;
  margin: 15px 0 10px;
  font-size: 22px;
  font-weight: 900;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 25px;
}

.gallery img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 12px;
  display: block;
  background: #ddd;
}

@media (min-width: 700px) {
  .gallery {
    grid-template-columns: repeat(4, 1fr);
  }

  .gallery img {
    height: 170px;
  }
}

/* =========================
   MENU
========================= */

.menu-title {
  text-align: center;
  font-size: 28px;
  font-weight: 900;
  margin: 25px 0 15px;
}

.category {
  background: white;
  border-radius: 14px;
  margin-bottom: 18px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.category h2 {
  margin: 0;
  padding: 14px 16px;
  background: #111;
  color: white;
  font-size: 20px;
}

.product {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid #eee;
}

.product:last-child {
  border-bottom: none;
}

.product-name {
  flex: 1;
  font-size: 16px;
  font-weight: 600;
}

.product-price {
  font-weight: 900;
  white-space: nowrap;
}

.add-btn {
  border: none;
  background: #111;
  color: white;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
}

.add-btn:active {
  transform: scale(.92);
}

/* =========================
   PANIER
========================= */

.cart-button {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 30px);
  max-width: 500px;
  background: #111;
  color: white;
  border: none;
  border-radius: 40px;
  padding: 15px 20px;
  font-size: 16px;
  font-weight: 900;
  box-shadow: 0 5px 20px rgba(0,0,0,.3);
  z-index: 1000;
  cursor: pointer;
}

/* =========================
   MODAL
========================= */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 2000;
  padding: 15px;
  overflow-y: auto;
}

.modal-box {
  background: white;
  max-width: 600px;
  margin: 30px auto;
  border-radius: 16px;
  padding: 20px;
}

.modal-box h2 {
  margin-top: 0;
  text-align: center;
}

.cart-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.cart-item-info {
  flex: 1;
}

.qty-buttons {
  display: flex;
  align-items: center;
  gap: 6px;
}

.qty-buttons button {
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 6px;
  background: #111;
  color: white;
  font-size: 18px;
}

.total {
  font-size: 21px;
  font-weight: 900;
  text-align: right;
  margin: 18px 0;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  margin: 6px 0 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 8px;
}

.whatsapp-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #25D366;
  color: white;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
}

.close-btn,
.clear-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  margin-top: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.close-btn {
  background: #ddd;
}

.clear-btn {
  background: #eee;
}

.delivery-address {

}

/* =========================

========================= */

footer {

  padding: 35px 15px 110px;
  color: #555;
  font-size: 14px;

let cart = [];

/* =========================
   AFFICHER LE MENU
========================= */

function renderMenu() {

  const container = document.getElementById("products");

  container.innerHTML = "";

  menu.forEach(section => {

    const category = document.createElement("div");

    category.className = "category";

    const title = document.createElement("h2");

    title.textContent = section.category;

    category.appendChild(title);

    section.items.forEach(item => {

      const name = item[0];
      const price = item[1];

      const row = document.createElement("div");

      row.className = "product";

      const nameDiv = document.createElement("div");

      nameDiv.className = "product-name";

      nameDiv.textContent = name;

      const priceDiv = document.createElement("div");

      priceDiv.className = "product-price";

      priceDiv.textContent = formatPrice(price);

      const button = document.createElement("button");

      button.className = "add-btn";

      button.textContent = "+";

      button.addEventListener("click", function() {

        addToCart(name, price);

      });

      row.appendChild(nameDiv);
      row.appendChild(priceDiv);
      row.appendChild(button);

      category.appendChild(row);

    });

    container.appendChild(category);

  });

}

/* =========================
   AJOUTER AU PANIER
========================= */

function addToCart(name, price) {

  const existing = cart.find(item => item.name === name);

  if (existing) {

    existing.quantity++;

  } else {

    cart.push({
      name: name,
      price: price,
      quantity: 1
    });

  }

  updateCart();

}

/* =========================
   QUANTITÉ
========================= */

function changeQuantity(index, amount) {

  if (!cart[index]) return;

  cart[index].quantity += amount;

  if (cart[index].quantity <= 0) {

    cart.splice(index, 1);

  }

  updateCart();

}

/* =========================
   TOTAL
========================= */

function getTotal() {

  return cart.reduce(
    (total, item) =>
      total + item.price * item.quantity,
    0
  );

}

function getCount() {

  return cart.reduce(
    (count, item) =>
      count + item.quantity,
    0
  );

}

/* =========================
   PANIER
========================= */

function updateCart() {

  document.getElementById("cartCount").textContent =
    getCount();

  document.getElementById("cartTotal").textContent =
    formatPrice(getTotal());

  renderCart();

}

function renderCart() {

  const container =
    document.getElementById("cartItems");

  if (cart.length === 0) {

    container.innerHTML =
      "<p style='text-align:center;'>Votre panier est vide.</p>";

    document.getElementById("modalTotal").textContent =
      formatPrice(0);

    return;
  }

  container.innerHTML = "";

  cart.forEach((item, index) => {

    const row =
      document.createElement("div");

    row.className = "cart-item";

    const info =
      document.createElement("div");

    info.className = "cart-item-info";

    info.innerHTML =
      "<strong>" +
      item.name +
      "</strong><br>" +
      formatPrice(item.price) +
      " × " +
      item.quantity;

    const qty =
      document.createElement("div");

    qty.className = "qty-buttons";

    const minus =
      document.createElement("button");

    minus.textContent = "−";

    minus.addEventListener("click", function() {
      changeQuantity(index, -1);
    });

    const number =
      document.createElement("strong");

    number.textContent = item.quantity;

    const plus =
      document.createElement("button");

    plus.textContent = "+";

    plus.addEventListener("click", function() {
      changeQuantity(index, 1);
    });

    qty.appendChild(minus);
    qty.appendChild(number);
    qty.appendChild(plus);

    const itemTotal =
      document.createElement("strong");

    itemTotal.textContent =
      formatPrice(item.price * item.quantity);

    row.appendChild(info);
    row.appendChild(qty);
    row.appendChild(itemTotal);

    container.appendChild(row);

  });

  document.getElementById("modalTotal").textContent =
    formatPrice(getTotal());

}

/* =========================
   MODAL
========================= */

function openCart() {

  document.getElementById("cartModal").style.display =
    "block";

  renderCart();

}

function closeCart() {

  document.getElementById("cartModal").style.display =
    "none";

}

/* =========================
   LIVRAISON
========================= */

function toggleAddress() {

  const type =
    document.getElementById("orderType").value;

  const box =
    document.getElementById("addressBox");

  if (type === "Livraison") {

    box.style.display = "block";

  } else {

    box.style.display = "none";

  }

}

/* =========================
   VIDER PANIER
========================= */

function clearCart() {

  if (cart.length === 0) return;

  if (confirm("Voulez-vous vider le panier ?")) {

    cart = [];

    updateCart();

  }

}

/* =========================
   WHATSAPP
========================= */

function sendOrder() {

  if (cart.length === 0) {

    alert("Votre panier est vide.");

    return;
  }

  const name =
    document.getElementById("customerName")
      .value.trim();

  const phone =
    document.getElementById("customerPhone")
      .value.trim();

  const type =
    document.getElementById("orderType")
      .value;

  const address =
    document.getElementById("customerAddress")
      .value.trim();

  const note =
    document.getElementById("customerNote")
      .value.trim();

  if (!name) {

    alert("Veuillez entrer votre nom.");

    return;
  }

  if (!phone) {

    alert("Veuillez entrer votre numéro de téléphone.");

    return;
  }

  if (type === "Livraison" && !address) {

    alert("Veuillez entrer votre adresse de livraison.");

    return;
  }

  let message = "";

  message += "🍔 *NOUVELLE COMMANDE - TOP SNACK*";
  message += "\n\n";

  message += "👤 *Nom:* " + name;
  message += "\n";

  message += "📞 *Téléphone:* " + phone;
  message += "\n";

  message += "📦 *Commande:* " + type;
  message += "\n";

  if (type === "Livraison") {

    message += "📍 *Adresse:* " + address;
    message += "\n";

  }

  message += "\n";
  message += "🛒 *ARTICLES:*";
  message += "\n";

  cart.forEach(item => {

    message +=
      "• " +
      item.name +
      " × " +
      item.quantity +
      " = " +
      formatPrice(
        item.price * item.quantity
      );

    message += "\n";

  });

  message += "\n";

  message +=
    "💰 *TOTAL: " +
    formatPrice(getTotal()) +
    "*";

  if (note) {

    message += "\n\n";
    message += "📝 *Note:* " + note;

  }

  message += "\n\n";
  message += "Merci — TOP SNACK";

  const whatsappNumber =
    "32496969628";

  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.open(
    whatsappURL,
    "_blank"
  );

}

/* =========================
   PRIX
========================= */

function formatPrice(price) {

  return price
    .toFixed(2)
    .replace(".", ",") +
    " €";

}

/* =========================

========================= */

renderMenu();
