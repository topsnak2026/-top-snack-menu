<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  font-family:Arial,sans-serif;
  padding-bottom:95px;
}

header{
  background:#111;

  text-align:center;

}

header h1{
  margin:0;
  font-size:34px;

.menu{

.category{

.product{

  align-items:center;
  justify-content:space-between;
  gap:10px;

.product-name{
  font-weight:bold;

}

.controls{

  align-items:center;
  gap:8px;

.controls button{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  font-size:22px;
  font-weight:bold;
}

.qty{
  min-width:25px;

  font-weight:bold;
}

.drink-select{
  margin-top:8px;
  width:100%;
  padding:9px;
  border:1px solid #ccc;
  border-radius:8px;
}

.menu-images{
  margin-top:30px;
}

.menu-images img{
  width:100%;
  display:block;

footer{

  text-align:center;
  padding:25px 15px;
  line-height:1.7;
}

footer a{

}

.cart-floating{

  left:12px;
  right:12px;
  bottom:12px;
  z-index:1000;
}

.cart-floating button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  background:#168a35;
  color:white;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:2000;
  padding:12px;
  overflow-y:auto;
}

.overlay.active{
  display:block;
}

.order-box{
  max-width:550px;
  margin:15px auto;
  background:white;
  border-radius:20px;
  padding:20px;
}

.order-box h2{
  text-align:center;
  margin-top:5px;
}

.close{
  float:right;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#eee;
  font-size:24px;
}

.cart-list{
  background:#f5f5f5;
  border-radius:12px;
  padding:12px;
  margin:15px 0;
}

.cart-line{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #ddd;
}

.cart-line:last-child{
  border-bottom:0;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:bold;
  margin-top:15px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  font-family:Arial,sans-serif;
}

textarea{
  min-height:80px;
}

.delivery-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.delivery-option{
  border:2px solid #ddd;
  border-radius:12px;
  padding:13px;
  text-align:center;
  font-weight:bold;

.delivery-option.selected{

.whatsapp{

  border-radius:12px;
  background:#168a35;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.clear{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#eee;
}

.empty{

  padding:15px;
  color:#666;
}

@media(max-width:500px){
  .delivery-box{
    grid-template-columns:1fr;

const drinkVariants={
"FANTA":["JAUNE","VERT","VIOLET"],
"LIPTON":["JAUNE","BLEU"],
"OASIS":["VERT","JAUNE","VIOLET"],
"TERAPICO":["BLEU"]
};

let cart=[];
let orderType="takeaway";

function renderMenu(){

const container=document.getElementById("products");

container.innerHTML="";

menu.forEach((category,ci)=>{

const section=document.createElement("section");
section.className="category";

const title=document.createElement("div");
title.className="category-title";
title.textContent=category.name;

section.appendChild(title);

category.items.forEach((item,ii)=>{

const name=item[0];
const price=item[1];

const product=document.createElement("div");
product.className="product";

let variantHTML="";

if(drinkVariants[name]){
variantHTML=
`<select class="drink-select" id="variant-${ci}-${ii}">
<option value="">Choisir la variante</option>
${drinkVariants[name].map(v=>`<option value="${v}">${v}</option>`).join("")}
</select>`;
}

product.innerHTML=`
<div class="product-info">
<div class="product-name">${name}</div>
<div class="product-price">${price.toFixed(2)}€</div>
${variantHTML}
</div>

<div class="controls">
<button onclick="changeQty(${ci},${ii},-1)">−</button>
<span class="qty" id="qty-${ci}-${ii}">0</span>
<button onclick="changeQty(${ci},${ii},1)">+</button>
</div>
`;

section.appendChild(product);

});

container.appendChild(section);

});

}

function changeQty(ci,ii,change){

const item=menu[ci].items[ii];
const name=item[0];
const price=item[1];

let variant="";

if(drinkVariants[name]){
const select=document.getElementById(`variant-${ci}-${ii}`);
variant=select.value;

if(change>0 && !variant){
alert("Veuillez choisir la variante de "+name+".");
return;
}
}

const key=ci+"-"+ii+"-"+variant;

let existing=cart.find(x=>x.key===key);

if(change>0){

if(existing){
existing.qty++;
}else{
cart.push({
key:key,
category:menu[ci].name,
name:name,
price:price,
qty:1,
variant:variant
});
}

}else{

if(existing){
existing.qty--;

if(existing.qty<=0){
cart=cart.filter(x=>x.key!==key);
}
}

}

updateQtyDisplays();
updateCart();

}

function updateQtyDisplays(){

menu.forEach((category,ci)=>{

category.items.forEach((item,ii)=>{

let total=0;

cart.forEach(x=>{
if(x.category===category.name && x.name===item[0]){
total+=x.qty;
}
});

const el=document.getElementById(`qty-${ci}-${ii}`);

if(el) el.textContent=total;

});

});

}

function getTotal(){

return cart.reduce((sum,item)=>{
return sum+(item.price*item.qty);
},0);

}

function getCount(){

return cart.reduce((sum,item)=>{
return sum+item.qty;
},0);

}

function updateCart(){

const total=getTotal();
const count=getCount();

document.getElementById("floatingCount").textContent=count;
document.getElementById("floatingTotal").textContent=total.toFixed(2)+"€";
document.getElementById("cartTotal").textContent=total.toFixed(2)+"€";

const list=document.getElementById("cartList");

if(cart.length===0){
list.innerHTML=`<div class="empty">Votre panier est vide.</div>`;
return;
}

list.innerHTML=cart.map(item=>{

let label=item.name;

if(item.variant){
label+=" ("+item.variant+")";
}

return`
<div class="cart-line">
<span>${item.qty} × ${label}</span>
<strong>${(item.qty*item.price).toFixed(2)}€</strong>
</div>
`;

}).join("");

}

function openOrder(){

updateCart();

document.getElementById("orderOverlay")
.classList.add("active");

}

function closeOrder(){

document.getElementById("orderOverlay")
.classList.remove("active");

}

function selectType(type){

orderType=type;

document.getElementById("takeawayOption")
.classList.toggle("selected",type==="takeaway");

document.getElementById("deliveryOption")
.classList.toggle("selected",type==="delivery");

document.getElementById("addressArea").style.display=
type==="delivery"?"block":"none";

}

function sendWhatsApp(){

if(cart.length===0){
alert("Veuillez ajouter au moins un produit.");
return;
}

const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const address=document.getElementById("customerAddress").value.trim();
const note=document.getElementById("customerNote").value.trim();

if(!name){
alert("Veuillez entrer votre nom.");
return;
}

if(!phone){
alert("Veuillez entrer votre numéro de téléphone.");
return;
}

if(orderType==="delivery" && !address){
alert("Veuillez entrer votre adresse de livraison.");
return;
}

let message="🛒 *NOUVELLE COMMANDE - TOP SNACK*\n\n";

message+="👤 Nom : "+name+"\n";
message+="📞 Téléphone : "+phone+"\n";

message+="📦 Type : "+
(orderType==="takeaway"?"À emporter":"Livraison")+"\n";

if(orderType==="delivery"){
message+="📍 Adresse : "+address+"\n";
}

message+="\n🍔 *COMMANDE :*\n";

cart.forEach(item=>{

let label=item.name;

if(item.variant){
label+=" ("+item.variant+")";
}

message+=
item.qty+" × "+label+
" — "+(item.qty*item.price).toFixed(2)+"€\n";

});

message+="\n💰 *TOTAL : "+getTotal().toFixed(2)+"€*\n";

if(note){
message+="\n📝 Remarque : "+note+"\n";
}

const whatsappNumber="32496969628";

const url=
"https://wa.me/"+
whatsappNumber+
"?text="+
encodeURIComponent(message);

window.location.href=url;

}

function clearCart(){

cart=[];

updateQtyDisplays();
updateCart();

document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";
document.getElementById("customerAddress").value="";
document.getElementById("customerNote").value="";

selectType("takeaway");

}

document.getElementById("orderOverlay")
.addEventListener("click",function(e){

if(e.target===this){
closeOrder();
}

});

renderMenu();
updateCart();

</script>
