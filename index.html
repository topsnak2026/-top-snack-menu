            gap: 10px;

        .brand {

            align-items: center;
            gap: 10px;
        }
        .brand h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.9rem;
            color: var(--yellow);
            letter-spacing: 1px;
            text-transform: uppercase;

        .brand span {
            font-size: 0.85rem;
            color: #fff;
            background: #222;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--yellow);

        .status-box {
            display: flex;
            align-items: center;

            font-size: 0.85rem;
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .status-open { background: rgba(46, 204, 113, 0.2); color: var(--green); border: 1px solid var(--green); }

        .admin-btn {
            background: #222;
            color: var(--text-muted);
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .categories-nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 12px 20px;
            background: #141414;
            border-bottom: 1px solid #2a2a2a;
            position: sticky;
            top: 72px;
            z-index: 90;
            scrollbar-width: none;
        }
        .categories-nav::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: var(--dark-card);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 25px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;

            color: var(--black);
            border-color: var(--yellow);
        }

            margin: 0 auto;
            padding: 20px;
        }

            border-left: 5px solid var(--yellow);
            padding-left: 12px;

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 18px;
        }
        .card {
            background: var(--dark-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: var(--yellow);
        }
        .card-img-wrap {

            height: 180px;
            background: #111;
            position: relative;
            overflow: hidden;
        }
        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.75);
            color: var(--yellow);
            font-size: 0.7rem;

            padding: 4px 8px;

            height: 28px;
            border-radius: 8px;

            font-size: 1.1rem;

            align-items: center;

            color: #888;

            color: #888;
            cursor: not-allowed;

            background: rgba(0,0,0,0.85);

            align-items: center;
            justify-content: center;
            padding: 20px;

<header>
    <div class="brand">
        <h1>👑 TOP SNACK</h1>
        <span>11:00 - 23:00</span>
    </div>
    <div class="status-box">
        <span id="storeStatus" class="status-badge status-open">● Ouvert (Livraison)</span>
        <button class="admin-btn" onclick="toggleAdminPause()">Pause Livreur</button>
    </div>
</header>

<nav class="categories-nav" id="catNav"></nav>

<main class="container" id="menuContainer"></main>

<div class="cart-bar">

        Total (<span id="cartCount">0</span> articles) : <span id="cartTotal">0,00€</span>
    </div>
    <button class="checkout-btn" id="openCartBtn" onclick="openModal()" disabled>Commander</button>
</div>

<div class="modal" id="orderModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Votre Commande - TOP SNACK</h2>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <div id="cartItemsList" style="margin-bottom:15px;"></div>
        <div class="form-group">
            <label>Nom & Prénom *</label>
            <input type="text" id="custName" placeholder="Ex: Jean Dupont" required>
        </div>
        <div class="form-group">
            <label>Téléphone *</label>
            <input type="tel" id="custPhone" placeholder="Ex: 0470 00 00 00" required>
        </div>
        <div class="form-group">
            <label>Adresse de livraison *</label>
            <textarea id="custAddress" rows="2" placeholder="Rue, numéro, code postal, ville" required></textarea>
        </div>
        <div class="form-group">
            <label>Remarques (Sauces, sans oignons, etc.)</label>
            <input type="text" id="custNote" placeholder="Ex: Sauce andalouse sur les frites">
        </div>
        <button class="checkout-btn" style="width:100%; margin-top:10px;" onclick="submitOrder()">Envoyer la commande</button>
    </div>
</div>

        <circle cx="200" cy="120" r="85" fill="${accent}" opacity="0.18"/>

    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);

let cart = {};
let manualPause = false;

function checkStoreOpen() {
    if (manualPause) return false;
    const now = new Date();
    const hour = now.getHours();
    return hour >= 11 && hour < 23;
}

function updateStatusUI() {
    const badge = document.getElementById("storeStatus");
    const isOpen = checkStoreOpen();
    if (manualPause) {
        badge.className = "status-badge status-closed";
        badge.textContent = "● Pause Livraison (Temporaire)";
    } else if (isOpen) {
        badge.className = "status-badge status-open";
        badge.textContent = "● Ouvert (11h - 23h)";
    } else {
        badge.className = "status-badge status-closed";
        badge.textContent = "● Fermé (Ouvre à 11h00)";
    }
}

function toggleAdminPause() {
    manualPause = !manualPause;
    updateStatusUI();
    renderMenu();
    updateCartBar();
}

function renderCategories() {
    const nav = document.getElementById("catNav");
    nav.innerHTML = menuData.map((cat, idx) => 
        `<button class="cat-btn ${idx === 0 ? 'active' : ''}" onclick="scrollToCat('${cat.category}', this)">${cat.category}</button>`
    ).join("");
}

function scrollToCat(catName, btn) {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const el = document.getElementById("cat_" + catName);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderMenu() {
    const container = document.getElementById("menuContainer");
    const isOpen = checkStoreOpen();
    container.innerHTML = menuData.map(cat => `
        <section id="cat_${cat.category}">
            <h2 class="category-title">${cat.category}</h2>
            <div class="menu-grid">
                ${cat.items.map(item => {
                    const qty = cart[item.id] || 0;
                    const fallback = getFoodImg(item.name, "#1e1e1e", "#FFD700");
                    return `
                    <div class="card">
                        <div class="card-img-wrap">
                            <span class="card-badge">${cat.badge}</span>
                            <img src="${item.img}" alt="${item.name}" onerror="this.onerror=null;this.src='${fallback}';">
                        </div>
                        <div class="card-body">
                            <div>
                                <div class="card-title">${item.name}</div>
                                <div class="card-desc">${item.desc}</div>
                            </div>
                            <div class="card-footer">
                                <span class="price">${item.price.toFixed(2).replace('.', ',')}€</span>
                                <div class="qty-controls">
                                    <button class="qty-btn" onclick="changeQty('${item.id}', -1)" ${qty === 0 || !isOpen ? 'disabled' : ''}>-</button>
                                    <span class="qty-val">${qty}</span>
                                    <button class="qty-btn" onclick="changeQty('${item.id}', 1)" ${!isOpen ? 'disabled' : ''}>+</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }).join("")}
            </div>
        </section>
    `).join("");
}

function changeQty(id, delta) {
    if (!checkStoreOpen()) return;
    cart[id] = (cart[id] || 0) + delta;
    if (cart[id] <= 0) delete cart[id];
    renderMenu();
    updateCartBar();
}

function updateCartBar() {
    let total = 0;
    let count = 0;
    for (const [id, qty] of Object.entries(cart)) {
        for (const cat of menuData) {
            const found = cat.items.find(i => i.id === id);
            if (found) {
                total += found.price * qty;
                count += qty;
                break;
            }
        }
    }
    document.getElementById("cartCount").textContent = count;
    document.getElementById("cartTotal").textContent = total.toFixed(2).replace('.', ',') + "€";
    document.getElementById("openCartBtn").disabled = count === 0 || !checkStoreOpen();
}

function openModal() {
    const list = document.getElementById("cartItemsList");
    let html = "";
    let total = 0;
    for (const [id, qty] of Object.entries(cart)) {
        for (const cat of menuData) {
            const found = cat.items.find(i => i.id === id);
            if (found) {
                const sub = found.price * qty;
                total += sub;
                html += `<div class="cart-item-row"><span>${qty}x ${found.name}</span><span>${sub.toFixed(2).replace('.', ',')}€</span></div>`;
                break;
            }
        }
    }
    html += `<div class="cart-item-row" style="font-weight:bold; color:#FFD700; border-top:1px solid #555; margin-top:5px;"><span>TOTAL</span><span>${total.toFixed(2).replace('.', ',')}€</span></div>`;
    list.innerHTML = html;
    document.getElementById("orderModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("orderModal").style.display = "none";
}

function submitOrder() {
    const name = document.getElementById("custName").value.trim();
    const phone = document.getElementById("custPhone").value.trim();
    const address = document.getElementById("custAddress").value.trim();
    if (!name || !phone || !address) {
        alert("Veuillez remplir votre nom, téléphone et adresse.");
        return;
    }
    alert("Merci " + name + " ! Votre commande Top Snack a bien été enregistrée.");
    cart = {};
    closeModal();
    renderMenu();
    updateCartBar();
}

updateStatusUI();
renderCategories();
renderMenu();
updateCartBar();
</script>
