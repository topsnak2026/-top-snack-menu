let cart=[];
const euro=n=>n.toFixed(2).replace(".",",")+" €";
function renderProducts(){

function add(i){let x=cart.find(a=>a.i===i);x?x.q++:cart.push({i,q:1});renderCart()}
function minus(i){let x=cart.find(a=>a.i===i);if(!x)return;x.q--;if(x.q<1)cart=cart.filter(a=>a.i!==i);renderCart()}
function renderCart(){
let box=document.getElementById("cartItems");let sum=0;
if(!cart.length){box.innerHTML="Panier vide.";document.getElementById("total").textContent="0,00 €";return}
box.innerHTML=cart.map(x=>{let p=products[x.i],s=p[1]*x.q;sum+=s;return <div class="row"><span>${p[0]} × ${x.q}</span><span>${euro(s)} <button onclick="minus(${x.i})">−</button></span></div>}).join("");
document.getElementById("total").textContent=euro(sum);
}
function toggleOrder(){document.getElementById("order").classList.toggle("hidden");document.getElementById("order").scrollIntoView({behavior:"smooth"})}
function deliveryChanged(){document.getElementById("address").classList.toggle("hidden",document.getElementById("type").value!=="delivery");document.getElementById("address").required=document.getElementById("type").value==="delivery"}
function submitOrder(e){
e.preventDefault();

${note?\n📝 Remarque : ${note}:""};
window.open(https://wa.me/32496969628?text=${encodeURIComponent(message)},"_blank");
