/* =========================================================
   PANIER
========================================================= */

let cart = [];


/* =========================================================
   AFFICHAGE MENU
========================================================= */

function renderMenu(){

  const menu = document.getElementById("menu");

  menu.innerHTML = "";

  menuData.forEach((category, categoryIndex)=>{

    const section = document.createElement("section");

    section.className = "category";

    section.innerHTML = `
      <div class="category-title">
        ${category.category}
      </div>

      <div class="products">

        ${category.items.map((item,itemIndex)=>{

          const name = item[0];
          const price = item[1];

          return `

            <div class="product">

              <img
                class="product-img"
                src="${category.image}"
                alt="${name}"
                onerror="this.style.display='none'"
              >

              <div class="product-info">

                <div class="product-name">
                  ${name}
                </div>

                <div class="product-price">
                  ${formatPrice(price)}
                </div>

                <div class="controls">

                  <button
                    class="qty-btn"
                    onclick="changeQty(${categoryIndex},${itemIndex},-1)"
                  >−</button>

                  <span
                    class="qty"
                    id="qty-${categoryIndex}-${itemIndex}"
                  >0</span>

                  <button
                    class="qty-btn"
                    onclick="changeQty(${categoryIndex},${itemIndex},1)"
                  >+</button>

                  <button
                    class="add-btn"
                    onclick="addProduct(${categoryIndex},${itemIndex})"
                  >
                    Ajouter
                  </button>

                </div>

              </div>

            </div>

          `;

        }).join("")}

      </div>
    `;

    menu.appendChild(section);

  });

}


/* =========================================================
   AJOUTER PRODUIT
========================================================= */

function addProduct(categoryIndex,itemIndex){

  const category = menuData[categoryIndex];

  const product = category.items[itemIndex];

  const name = product[0];
  const price = product[1];

  const key = categoryIndex + "-" + itemIndex;

  const existing = cart.find(item => item.key === key);

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      key:key,
      category:category.category,
      name:name,
      price:price,
      qty:1
    });

  }

  updateQuantityDisplay(categoryIndex,itemIndex);

  renderCart();

}


/* =========================================================
   CHANGER QUANTITE
========================================================= */

function changeQty(categoryIndex,itemIndex,amount){

  const category = menuData[categoryIndex];

  const product = category.items[itemIndex];

  const key = categoryIndex + "-" + itemIndex;

  let existing = cart.find(item => item.key === key);

  if(!existing && amount > 0){

    cart.push({
      key:key,
      category:category.category,
      name:product[0],
      price:product[1],
      qty:amount
    });

  }else if(existing){

    existing.qty += amount;

    if(existing.qty <= 0){

      cart = cart.filter(item => item.key !== key);

    }

  }

  updateQuantityDisplay(categoryIndex,itemIndex);

  renderCart();

}


/* =========================================================
   QUANTITE AFFICHAGE
========================================================= */

function updateQuantityDisplay(categoryIndex,itemIndex){

  const key = categoryIndex + "-" + itemIndex;

  const item = cart.find(x => x.key === key);

  const element = document.getElementById(
    "qty-" + categoryIndex + "-" + itemIndex
  );

  if(element){

    element.textContent = item ? item.qty : 0;

  }

}


/* =========================================================
   PANIER
========================================================= */

function renderCart(){

  const cartItems = document.getElementById("cartItems");

  const cartCount = document.getElementById("cartCount");

  const cartTotal = document.getElementById("cartTotal");

  if(cart.length === 0){

    cartItems.innerHTML =
      `<div style="color:#777;padding:8px 0">
        Votre panier est vide.
      </div>`;

    cartCount.textContent = "0 article(s)";

    cartTotal.textContent = "0,00€";

    return;

  }

  let total = 0;

  let count = 0;

  cartItems.innerHTML = "";

  cart.forEach(item=>{

    const subtotal = item.price * item.qty;

    total += subtotal;

    count += item.qty;

    const div = document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <div>
        <strong>${item.name}</strong><br>
        <small>${item.qty} × ${formatPrice(item.price)}</small>
      </div>

      <strong>
        ${formatPrice(subtotal)}
      </strong>

    `;

    cartItems.appendChild(div);

  });

  cartCount.textContent = count + " article(s)";

  cartTotal.textContent = formatPrice(total);

}


/* =========================================================
   VIDER PANIER
========================================================= */

function clearCart(){

  if(cart.length === 0) return;

  if(!confirm("Vider le panier ?")) return;

  cart = [];

  document.querySelectorAll(".qty").forEach(el=>{
    el.textContent = "0";
  });

  renderCart();

}


/* =========================================================
   PRIX
========================================================= */

function formatPrice(price){

  return price.toFixed(2).replace(".",",") + "€";

}


/* =========================================================
   COMMANDE
========================================================= */

function openOrder(){

  if(cart.length === 0){

    alert("Votre panier est vide.");

    return;

  }

  const summary = document.getElementById("orderSummary");

  let html = "";

  let total = 0;

  cart.forEach(item=>{

    const subtotal = item.price * item.qty;

    total += subtotal;

    html += `
      <div style="
        padding:8px 0;
        border-bottom:1px solid #ddd;
      ">
        ${item.qty} × <strong>${item.name}</strong>
        <span style="float:right">
          ${formatPrice(subtotal)}
        </span>
      </div>
    `;

  });

  html += `
    <div style="
      padding:12px 0;
      font-size:20px;
      font-weight:bold;
    ">
      TOTAL
      <span style="float:right">
        ${formatPrice(total)}
      </span>
    </div>
  `;

  summary.innerHTML = html;

  document.getElementById("orderOverlay").style.display = "block";

}


function closeOrder(){

  document.getElementById("orderOverlay").style.display = "none";

}


/* =========================================================
   TYPE COMMANDE
========================================================= */

function changeOrderType(){

  const type = document.getElementById("orderType").value;

  const box = document.getElementById("deliveryAddressBox");

  if(type === "delivery"){

    box.style.display = "block";

    updateQRCode();

  }else{

    box.style.display = "none";

  }

}


/* =========================================================

========================================================= */

  const address =

  const qrBox =
    document.getElementById("qrBox");

  const qrImage =
    document.getElementById("qrImage");

  const qrText =
    document.getElementById("qrText");

  if(!address){

    qrBox.style.display = "none";

    return;

  }

  const mapsUrl =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(address);

  qrImage.src =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
    encodeURIComponent(mapsUrl);

  qrText.textContent = address;

  qrBox.style.display = "block";

}


/* =========================================================
   WHATSAPP
========================================================= */

function sendWhatsApp(){

  if(cart.length === 0){

    alert("Votre panier est vide.");

    return;

  }

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const type =
    document.getElementById("orderType").value;

  const address =
    document.getElementById("customerAddress").value.trim();

  const note =
    document.getElementById("customerNote").value.trim();


  if(!name){

    alert("Veuillez entrer votre nom.");

    return;

  }


  if(!phone){

    alert("Veuillez entrer votre numéro de téléphone.");

    return;

  }


  if(type === "delivery" && !address){

    alert("Veuillez entrer votre adresse de livraison.");

    return;

  }


  let message =
    "🍔 *NOUVELLE COMMANDE - TOP SNACK*%0A%0A";


  message +=
    "👤 Nom : " +
    encodeURIComponent(name) +
    "%0A";


  message +=
    "📞 Téléphone : " +
    encodeURIComponent(phone) +
    "%0A";


  message +=
    "📦 Type : " +
    encodeURIComponent(
      type === "delivery"
      ? "Livraison"
      : "À emporter"
    ) +
    "%0A";


  if(type === "delivery"){

    message +=
      "📍 Adresse : " +
      encodeURIComponent(address) +
      "%0A";

  }


  message += "%0A🛒 *COMMANDE*%0A";


  let total = 0;


  cart.forEach(item=>{

    const subtotal =
      item.price * item.qty;

    total += subtotal;

    message +=
      encodeURIComponent(
        item.qty +
        " × " +
        item.name +
        " — " +
        formatPrice(subtotal)
      ) +
      "%0A";

  });


  message +=
    "%0A💶 *TOTAL : " +
    encodeURIComponent(formatPrice(total)) +
    "*";


  if(note){

    message +=
      "%0A%0A📝 Remarque : " +
      encodeURIComponent(note);

  }


  message +=
    "%0A%0A📍 TOP SNACK%0A" +
    encodeURIComponent(
      "Rue Godfroid Kurth 109, 1140 Evere"
    );


  const whatsappUrl =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    message;


  window.open(
    whatsappUrl,
    "_blank"
  );

}
