.product-controls button:active {

}
.product-quantity {
  min-width: 24px;
  text-align: center;
  font-size: 17px;
  font-weight: 900;
}
/* =========================
   PANIER
========================= */
.cart-button {

========================= */

  z-index: 2000;

/* =========================
   TROUVER LA QUANTITÉ
========================= */
function getProductQuantity(id) {
  const item = cart.find(
    product => product.id === id
  );
  return item ? item.quantity : 0;
}
/* =========================
   AFFICHER LE MENU
========================= */
function renderMenu() {
  const container =
    document.getElementById("products");
  container.innerHTML = "";
  menu.forEach(
    (section, categoryIndex) => {
      const category =
        document.createElement("div");
      category.className = "category";
      const title =
        document.createElement("h2");
      title.textContent =
        section.category;
      category.appendChild(title);
      section.items.forEach(
        (item, itemIndex) => {
          const name = item[0];
          const price = item[1];
          const productId =
            categoryIndex + "-" + itemIndex;
          const row =
            document.createElement("div");
          row.className = "product";
          const nameDiv =
            document.createElement("div");
          nameDiv.className =
            "product-name";
          nameDiv.textContent =
            name;
          const priceDiv =
            document.createElement("div");
          priceDiv.className =
            "product-price";
          priceDiv.textContent =
            formatPrice(price);
          /* CONTROLS */
          const controls =
            document.createElement("div");
          controls.className =
            "product-controls";
          const minus =
            document.createElement("button");
          minus.type = "button";
          minus.textContent = "−";
          minus.addEventListener(
            "click",
            function() {
              changeProductQuantity(
                productId,
                section.category,
                name,
                price,
                -1
              );
            }
          );
          const quantity =
            document.createElement("span");
          quantity.className =
            "product-quantity";
          quantity.id =
            "qty-" + productId;
          quantity.textContent =
            getProductQuantity(productId);
          const plus =
            document.createElement("button");
          plus.type = "button";
          plus.textContent = "+";
          plus.addEventListener(
            "click",
            function() {
              changeProductQuantity(
                productId,
                section.category,
                name,
                price,
                1
              );
            }
          );
          controls.appendChild(minus);
          controls.appendChild(quantity);
          controls.appendChild(plus);
          row.appendChild(nameDiv);
          row.appendChild(priceDiv);
          row.appendChild(controls);
          category.appendChild(row);
        }
      );
      container.appendChild(category);
    }
  );
}
/* =========================
   تغییر تعداد از داخل منو
========================= */
function changeProductQuantity(
  id,
  category,
  name,
  price,
  amount
) {
  const existing =
    cart.find(
      item => item.id === id
    );
  if (existing) {
    existing.quantity += amount;
    if (existing.quantity <= 0) {
      cart = cart.filter(
        item => item.id !== id
      );
    }
  } else if (amount > 0) {
    cart.push({
      id: id,
      category: category,
      name: name,
      price: price,
      quantity: 1
    });
  }
  updateCart();
}
/* =========================
   اضافه کردن به سبد
========================= */
function addToCart(
  id,
  category,
  name,
  price
) {
  const existing =
    cart.find(
      item => item.id === id
    );
  if (existing) {
    existing.quantity++;
  } else {
    cart.push({
      id: id,
      category: category,
      name: name,
      price: price,
      quantity: 1
    });
  }
  updateCart();
}
/* =========================
   تغییر تعداد در سبد
========================= */
function changeQuantity(
  index,
  amount
) {
  if (!cart[index]) return;
  cart[index].quantity += amount;
  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }
  updateCart();
}
/* =========================
   TOTAL
========================= */
function getTotal() {
  return cart.reduce(
    (total, item) =>
      total +
      item.price *
      item.quantity,
    0
  );
}
/* =========================
   تعداد کل
========================= */
function getCount() {
  return cart.reduce(
    (count, item) =>
      count +
      item.quantity,
    0
  );
}
/* =========================
   UPDATE
========================= */
function updateCart() {
  document.getElementById(
    "cartCount"
  ).textContent =
    getCount();
  document.getElementById(
    "cartTotal"
  ).textContent =
    formatPrice(
      getTotal()
    );
  renderCart();
  updateMenuQuantities();
}
/* =========================
   آپدیت عدد کنار محصولات
========================= */
function updateMenuQuantities() {
  menu.forEach(
    (section, categoryIndex) => {
      section.items.forEach(
        (item, itemIndex) => {
          const id =
            categoryIndex +
            "-" +
            itemIndex;
          const element =
            document.getElementById(
              "qty-" + id
            );
          if (element) {
            element.textContent =
              getProductQuantity(id);
          }
        }
      );
    }
  );
}
/* =========================
   CART
========================= */
function renderCart() {
  const container =
    document.getElementById(
      "cartItems"
    );
  if (cart.length === 0) {
    container.innerHTML =
      "<p style='text-align:center;'>Votre panier est vide.</p>";
    document.getElementById(
      "modalTotal"
    ).textContent =
      formatPrice(0);
    return;
  }
  container.innerHTML = "";
  cart.forEach(
    (item, index) => {
      const row =
        document.createElement("div");
      row.className =
        "cart-item";
      const info =
        document.createElement("div");
      info.className =
        "cart-item-info";
      info.innerHTML =
        "<strong>" +
        item.name +
        "</strong><br>" +
        "<small>" +
        item.category +
        "</small><br>" +
        formatPrice(item.price) +
        " × " +
        item.quantity;
      const qty =
        document.createElement("div");
      qty.className =
        "qty-buttons";
      const minus =
        document.createElement("button");
      minus.type = "button";
      minus.textContent = "−";
      minus.addEventListener(
        "click",
        function() {
          changeQuantity(
            index,
            -1
          );
        }
      );
      const number =
        document.createElement("strong");
      number.textContent =
        item.quantity;
      const plus =
        document.createElement("button");
      plus.type = "button";
      plus.textContent = "+";
      plus.addEventListener(
        "click",
        function() {
          changeQuantity(
            index,
            1
          );
        }
      );
      qty.appendChild(minus);
      qty.appendChild(number);
      qty.appendChild(plus);
      const itemTotal =
        document.createElement("strong");
      itemTotal.textContent =
        formatPrice(
          item.price *
          item.quantity
        );
      row.appendChild(info);
      row.appendChild(qty);
      row.appendChild(itemTotal);
      container.appendChild(row);
    }
  );
  document.getElementById(
    "modalTotal"
  ).textContent =
    formatPrice(
      getTotal()
    );
}

========================= */

    "cartModal"

/* =========================

========================= */
function closeCart() {
  document.getElementById(

    "none";
}
/* =========================

========================= */
function toggleAddress() {
  const type =
    document.getElementById(
      "orderType"
    ).value;
  const box =
    document.getElementById(
      "addressBox"
    );
  if (type === "Livraison") {
    box.style.display =
      "block";
  } else {
    box.style.display =
      "none";
  }
}
/* =========================
   CLEAR
========================= */
function clearCart() {
  if (cart.length === 0) return;
  if (
    confirm(
      "Voulez-vous vider le panier ?"
    )
  ) {
    cart = [];
    updateCart();
  }
}

   WHATSAPP
========================= */

  const phone =

    ).value.trim();

    document.getElementById(

    ).value;
  const address =
    document.getElementById(
      "customerAddress"
    ).value.trim();
  const note =
    document.getElementById(
      "customerNote"
    ).value.trim();
  if (!name) {
    alert(
      "Veuillez entrer votre nom."
    );
    return;
  }
  if (!phone) {
    alert(
      "Veuillez entrer votre numéro de téléphone."
    );
    return;
  }
  if (
    type === "Livraison" &&
    !address
  ) {
    alert(
      "Veuillez entrer votre adresse de livraison."
    );
    return;
  }
  let message = "";
  message +=
    "🍔 *NOUVELLE COMMANDE - TOP SNACK*";
  message += "\n\n";
  message +=
    "👤 *Nom:* " +
    name;
  message += "\n";
  message +=
    "📞 *Téléphone:* " +
    phone;
  message += "\n";
  message +=
    "📦 *Commande:* " +
    type;
  if (type === "Livraison") {
    message += "\n";
    message +=
      "📍 *Adresse:* " +
      address;
  }
  message += "\n\n";
  message +=
    "🛒 *ARTICLES:*";
  message += "\n";
  cart.forEach(
    item => {
      message +=
        "• " +
        item.category +
        " — " +
        item.name +
        " × " +
        item.quantity +
        " = " +
        formatPrice(
          item.price *
          item.quantity
        );
      message += "\n";
    }
  );
  message += "\n";
  message +=
    "💰 *TOTAL: " +
    formatPrice(
      getTotal()
    ) +
    "*";
  if (note) {
    message += "\n\n";
    message +=
      "📝 *Note:* " +
      note;
  }
  message += "\n\n";
  message +=
    "Merci — TOP SNACK";
  const whatsappNumber =
    "32496969628";
  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(
      message
    );
  window.open(
    whatsappURL,
    "_blank"
  );
}
/* =========================
   PRICE
========================= */
function formatPrice(price) {
  return price
    .toFixed(2)
    .replace(".", ",") +
    " €";
}
/* =========================
   START
========================= */
renderMenu();
updateCart();
</script>
